version: '3'
services:
    api:
        build:
            context: .
            dockerfile: app/dockerfile
        image: ite3068/api
        ports:
            - "6230:6230"
        depends_on:
            - mysql
        environment:
            PORT: 6230
            DB_HOST: mysql
            DB_USERNAME: maybe
            DB_PASSWORD: REMOVED-CREDENTIAL
            DB_PORT: 3306
            DB_DATABASE: ite3068
            ARCUS_HOST: arcus
            NBASE_ARC_HOST: nbase-arc
    mysql:
        image: mysql:latest
        ports:
            - "3306:3306"
        environment:
            MYSQL_ROOT_PASSWORD: REMOVED-CREDENTIAL
            MYSQL_USER: maybe
            MYSQL_PASSWORD: REMOVED-CREDENTIAL
            MYSQL_DATABASE: ite3068
    arcus:
        build:
            context: .
            dockerfile: arcus/dockerfile
        image: ite3068/arcus
        depends_on:
            - arcus-REMOVED-CREDENTIAL-1
            - arcus-REMOVED-CREDENTIAL-2
            - arcus-REMOVED-CREDENTIAL-3
        environment:
            MEMCACHED: arcus-REMOVED-CREDENTIAL-1;arcus-REMOVED-CREDENTIAL-2;arcus-REMOVED-CREDENTIAL-3;
    arcus-REMOVED-CREDENTIAL-1:
        image: ruo91/arcus:REMOVED-CREDENTIAL
        ports:
            - "11211:11211"
